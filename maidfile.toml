[project]
name = "requests"

[env]
API_VERSION = "1.21"
PLUGIN_VERSION = "0.3.0"
JDK_FLAGS = "--add-modules=jdk.incubator.vector -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20"

[tasks.create_server]
script = "scripts/init.sh"

[tasks.build]
script = ["gradle build", "cp project/build/libs/requests-%{env.PLUGIN_VERSION}-all.jar server/plugins"]

[tasks.start]
path = "server"
script = ["zsh -c 'java -Xms4096M -Xmx4096M %{env.JDK_FLAGS} -jar paper.jar --nogui'"]
